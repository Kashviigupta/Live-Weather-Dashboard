name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The state/UT archive is expensive to fetch and never changes for a
      # fixed date range, so keep it between runs.
      - name: Cache region archives
        uses: actions/cache@v4
        with:
          path: data/cache/regions
          key: regions-${{ hashFiles('backend/regions.py') }}

      - name: Check the page's CDN references resolve
        run: python scripts/check_assets.py

      - name: Run the Exp 1-5 analysis and freeze it to JSON
        run: python scripts/build_static.py --out docs

      # Requires Settings -> Pages -> Source = "GitHub Actions" (one-time).
      # The workflow token is not allowed to turn Pages on by itself.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
